<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART FUTURE CAPITAL (SFC) | React JSX & Cloud Web Platform</title>
  <meta name="description" content="SMART FUTURE CAPITAL (SFC) - Automated 3-Day High-Yield Micro-Savings & Liquidity Growth Platform. React JSX Frontend with Serverless Cloud Backend." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#001A40',
              gold: '#E5A93B',
              goldDark: '#B45309',
              blue: '#005AC1',
              green: '#10B981',
              card: '#FFFFFF',
              darkCard: '#0F172A',
              bgLight: '#F8FAFC',
              bgDark: '#020617'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for standalone JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .gold-glow {
      box-shadow: 0 4px 20px rgba(229, 169, 59, 0.25);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React JSX Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TIERS_DATA = [
      { id: 'tier_a', name: 'Tier A - Starter', minAmount: 6000, durationDays: 3, rate: 0.02, desc: 'Quick 3-day liquidity test', badge: 'Starter' },
      { id: 'tier_b', name: 'Tier B - Silver Growth', minAmount: 10000, durationDays: 3, rate: 0.02, desc: 'Standard 3-day capital accelerator', badge: 'Popular' },
      { id: 'tier_c', name: 'Tier C - Gold Master', minAmount: 15000, durationDays: 3, rate: 0.02, desc: 'Most popular community choice', badge: 'Featured' },
      { id: 'tier_d', name: 'Tier D - Platinum VIP', minAmount: 45000, durationDays: 3, rate: 0.02, desc: 'Maximum yield for high-volume savings', badge: 'High Yield' }
    ];

    const CURRENCIES = {
      RWF: { symbol: 'RWF', rate: 1 },
      USD: { symbol: '$', rate: 0.00073 },
      KES: { symbol: 'KSh', rate: 0.095 },
      UGX: { symbol: 'USh', rate: 2.72 },
      EUR: { symbol: '€', rate: 0.00067 }
    };

    const WEB_TRANSLATIONS = {
      EN: {
        dashboard: "Dashboard",
        cycles: "Active Cycles",
        withdrawals: "Withdrawals",
        admin: "Admin Hub",
        deposit: "+ Deposit",
        dark: "🌙 Dark",
        light: "☀️ Light"
      },
      RW: {
        dashboard: "Ahabanza",
        cycles: "Inshuro Zikora",
        withdrawals: "Kubikuza",
        admin: "Ubuyobozi",
        deposit: "+ Bika",
        dark: "🌙 Umwijima",
        light: "☀️ Urumuri"
      },
      FR: {
        dashboard: "Tableau de bord",
        cycles: "Cycles Actifs",
        withdrawals: "Retraits",
        admin: "Hub Admin",
        deposit: "+ Déposer",
        dark: "🌙 Sombre",
        light: "☀️ Clair"
      }
    };

    function App() {
      const [lang, setLang] = useState(() => {
        return localStorage.getItem('sfc_lang') || 'EN';
      });
      const [currency, setCurrency] = useState('RWF');
      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('sfc_theme') || 'dark';
      });
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, cycles, deposit, withdraw, admin
      const [reserveFund, setReserveFund] = useState(20000000);

      const t = WEB_TRANSLATIONS[lang] || WEB_TRANSLATIONS.EN;

      useEffect(() => {
        localStorage.setItem('sfc_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };
      const [userCycles, setUserCycles] = useState(() => {
        const saved = localStorage.getItem('sfc_cycles');
        return saved ? JSON.parse(saved) : [
          {
            id: 'CYC-1001',
            tierName: 'Tier C - Gold Master',
            depositAmount: 15000,
            interestRate: 0.02,
            profit: 300,
            totalPayout: 15300,
            startedAt: Date.now() - (1.5 * 86400000),
            maturityDate: Date.now() + (1.5 * 86400000),
            status: 'ACTIVE'
          }
        ];
      });

      const [deposits, setDeposits] = useState(() => {
        const saved = localStorage.getItem('sfc_deposits');
        return saved ? JSON.parse(saved) : [
          { id: 'DEP-8841', phone: '+250788123456', amount: 15000, momoTxId: 'TXN89327110', status: 'APPROVED', time: '1 day ago' }
        ];
      });

      const [withdrawals, setWithdrawals] = useState(() => {
        const saved = localStorage.getItem('sfc_withdrawals');
        return saved ? JSON.parse(saved) : [
          { id: 'WTH-3021', phone: '+250788123456', amount: 15300, status: 'PENDING', time: '4 hours ago' }
        ];
      });

      const [announcements, setAnnouncements] = useState([
        {
          id: '1',
          title: '🛡️ 20,000,000 RWF Capital Reserve Backing',
          content: 'All user 3-day savings cycles are 100% insured against loss with guaranteed payouts.',
          category: 'IMPORTANT',
          imageUrl: 'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&w=800&q=80',
          time: 'Just now',
          urgent: true
        },
        {
          id: '2',
          title: '⚡ MoMo Merchant Deposit Activated',
          content: 'Direct merchant code *182*8*1*1799283# deposits are credited automatically to your account.',
          category: 'NEWS',
          imageUrl: 'https://images.unsplash.com/photo-1559526324-4b87b5e36e44?auto=format&fit=crop&w=800&q=80',
          time: '2 hours ago',
          urgent: false
        },
        {
          id: '3',
          title: '🚀 High-Yield 3-Day Cycles Open',
          content: 'Tier A, B, C, and D plans are active! Start saving and receive your principal + yields.',
          category: 'PROMO',
          imageUrl: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=800&q=80',
          time: '1 day ago',
          urgent: false
        }
      ]);

      const [depositModalOpen, setDepositModalOpen] = useState(false);
      const [notificationsModalOpen, setNotificationsModalOpen] = useState(false);
      const [selectedTierForDeposit, setSelectedTierForDeposit] = useState(TIERS_DATA[2]);
      const [notification, setNotification] = useState(null);
      const [welcomeBonusClaimed, setWelcomeBonusClaimed] = useState(() => {
        return localStorage.getItem('sfc_welcome_bonus') === 'true';
      });

      // Refer-a-Friend state
      const [referralCode] = useState('SFC50');
      const [pendingBonusPercent, setPendingBonusPercent] = useState(() => {
        const saved = localStorage.getItem('sfc_pending_bonus_percent');
        return saved ? parseFloat(saved) : 0.005; // default initial +0.5% pending boost
      });
      const [referralBonusCash, setReferralBonusCash] = useState(() => {
        const saved = localStorage.getItem('sfc_referral_bonus_cash');
        return saved ? parseFloat(saved) : 1000;
      });
      const [referredFriends, setReferredFriends] = useState(() => {
        const saved = localStorage.getItem('sfc_referred_friends');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          { id: 'ref_1', name: 'Eric Mugisha', phone: '+250 788 412 884', joinedAt: 'Yesterday', bonusGranted: '+0.5% Next Cycle Yield' }
        ];
      });

      useEffect(() => {
        localStorage.setItem('sfc_pending_bonus_percent', pendingBonusPercent.toString());
      }, [pendingBonusPercent]);

      useEffect(() => {
        localStorage.setItem('sfc_referral_bonus_cash', referralBonusCash.toString());
      }, [referralBonusCash]);

      useEffect(() => {
        localStorage.setItem('sfc_referred_friends', JSON.stringify(referredFriends));
      }, [referredFriends]);

      const handleClaimWelcomeBonus = () => {
        if (welcomeBonusClaimed) return;
        setWelcomeBonusClaimed(true);
        localStorage.setItem('sfc_welcome_bonus', 'true');
        const bonusDep = {
          id: 'DEP-BONUS-' + Math.floor(1000 + Math.random() * 9000),
          phone: '+250788123456',
          amount: 1000,
          momoTxId: 'BONUS-WELCOME-1000',
          status: 'APPROVED',
          time: 'Just now'
        };
        setDeposits(prev => [bonusDep, ...prev]);
        showToast('🎉 1,000 RWF Welcome Bonus claimed! Added to your funds.');
      };

      const handleSimulateReferral = (friendName = 'Aline Uwase') => {
        const phone = '+250 788 ' + Math.floor(100000 + Math.random() * 900000);
        const newFriend = {
          id: 'ref_' + Date.now(),
          name: friendName,
          phone: phone,
          joinedAt: 'Just now',
          bonusGranted: '+0.5% Next Cycle Yield & 1,000 RWF'
        };
        setReferredFriends(prev => [newFriend, ...prev]);
        setPendingBonusPercent(prev => prev + 0.005);
        setReferralBonusCash(prev => prev + 1000);
        const bonusDep = {
          id: 'DEP-REF-' + Math.floor(1000 + Math.random() * 9000),
          phone: '+250788123456',
          amount: 1000,
          momoTxId: 'BONUS-REF-' + Math.floor(1000 + Math.random() * 9000),
          status: 'APPROVED',
          time: 'Just now'
        };
        setDeposits(prev => [bonusDep, ...prev]);
        showToast(`🎉 ${friendName} registered with your referral link! +0.5% next cycle bonus & 1,000 RWF granted!`);
      };

      useEffect(() => {
        localStorage.setItem('sfc_cycles', JSON.stringify(userCycles));
      }, [userCycles]);

      useEffect(() => {
        localStorage.setItem('sfc_deposits', JSON.stringify(deposits));
      }, [deposits]);

      useEffect(() => {
        localStorage.setItem('sfc_withdrawals', JSON.stringify(withdrawals));
      }, [withdrawals]);

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const formatMoney = (rwfAmount) => {
        const cur = CURRENCIES[currency];
        const val = rwfAmount * cur.rate;
        if (currency === 'RWF') return Math.round(val).toLocaleString() + ' RWF';
        return cur.symbol + val.toFixed(2);
      };

      const totalDeposited = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.depositAmount, 0);
      }, [userCycles]);

      const totalEarned = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.profit, 0);
      }, [userCycles]);

      const handleStartCycle = (tier, customAmount = null) => {
        const amount = customAmount || tier.minAmount;
        const appliedBonus = pendingBonusPercent;
        const effectiveRate = tier.rate + appliedBonus;
        const profit = Math.round(amount * effectiveRate);
        const newCycle = {
          id: 'CYC-' + Math.floor(1000 + Math.random() * 9000),
          tierName: tier.name,
          depositAmount: amount,
          interestRate: effectiveRate,
          bonusApplied: appliedBonus,
          profit: profit,
          totalPayout: amount + profit,
          startedAt: Date.now(),
          maturityDate: Date.now() + (tier.durationDays * 86400000),
          status: 'ACTIVE'
        };
        setUserCycles([newCycle, ...userCycles]);
        if (appliedBonus > 0) {
          setPendingBonusPercent(0);
          showToast(`🎉 Cycle Activated with +${(appliedBonus * 100).toFixed(1)}% Referral Yield Boost applied! Total yield: +${(effectiveRate * 100).toFixed(1)}%`);
        } else {
          showToast(`🎉 3-Day Savings Cycle Activated for ${formatMoney(amount)}!`);
        }
      };

      const handleDepositSubmit = (formData) => {
        const paymentMethod = formData.paymentMethod || 'MTN Mobile Money';
        const newDep = {
          id: 'DEP-' + Math.floor(1000 + Math.random() * 9000),
          phone: formData.phone,
          amount: Number(formData.amount),
          momoTxId: formData.txId,
          paymentMethod: paymentMethod,
          network: paymentMethod,
          status: 'APPROVED',
          time: 'Just now'
        };
        setDeposits([newDep, ...deposits]);
        handleStartCycle(formData.tier, Number(formData.amount));
        setDepositModalOpen(false);
        setActiveTab('cycles');
        showToast(`⚡ Payment of ${formatMoney(Number(formData.amount))} confirmed via ${paymentMethod}! 3-Day Vault is now live!`);

        // Async API sync
        try {
          fetch('/api/deposits', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userId: 'USER-1',
              phone: formData.phone,
              amount: formData.amount,
              momoTxId: formData.txId,
              paymentMethod: paymentMethod,
              network: paymentMethod,
              tierId: formData.tier?.id
            })
          }).catch(() => {});
        } catch (e) {}
      };

      const handleWithdrawSubmit = (phone, amount) => {
        const numAmount = Number(amount);
        if (!phone || numAmount <= 0) {
          showToast('Please enter a valid phone and amount', 'error');
          return;
        }
        const newWth = {
          id: 'WTH-' + Math.floor(1000 + Math.random() * 9000),
          phone,
          amount: numAmount,
          status: 'PENDING',
          time: 'Just now'
        };
        setWithdrawals([newWth, ...withdrawals]);
        showToast(`🚀 Withdrawal request of ${formatMoney(numAmount)} submitted to ${phone}!`);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-[#020617] text-slate-900 dark:text-slate-100 transition-colors duration-200">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#001A40] text-white shadow-lg border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#E5A93B] to-amber-300 text-[#001A40] flex items-center justify-center font-extrabold text-xl shadow-md">
                  SFC
                </div>
                <div>
                  <div className="font-extrabold text-lg tracking-tight leading-none text-white">SMART FUTURE CAPITAL</div>
                  <div className="text-xs text-amber-400 font-semibold tracking-wider">3-DAY HIGH YIELD VAULT</div>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  {t.dashboard}
                </button>
                <button
                  onClick={() => setActiveTab('cycles')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'cycles' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  {t.cycles} ({userCycles.length})
                </button>
                <button
                  onClick={() => setActiveTab('withdraw')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'withdraw' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  {t.withdrawals}
                </button>
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'admin' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  {t.admin}
                </button>
              </nav>

              {/* Action, Notifications, Language, Theme Toggle and Currency */}
              <div className="flex items-center gap-2 sm:gap-3">
                {/* Language Switcher Dropdown */}
                <select
                  value={lang}
                  onChange={(e) => {
                    setLang(e.target.value);
                    localStorage.setItem('sfc_lang', e.target.value);
                  }}
                  className="bg-slate-800 text-amber-400 text-xs font-bold px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer"
                  title="Switch Language / Hitamo Ururimi / Choisir la Langue"
                >
                  <option value="EN">🇬🇧 EN</option>
                  <option value="RW">🇷🇼 RW</option>
                  <option value="FR">🇫🇷 FR</option>
                </select>

                {/* Theme Switcher Button (Dark / Light) */}
                <button
                  onClick={toggleTheme}
                  title={`Switch to ${theme === 'dark' ? 'Light' : 'Dark'} Mode`}
                  className="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-amber-300 border border-slate-700 transition-all flex items-center gap-1.5 text-xs font-bold shadow-sm"
                >
                  <span>{theme === 'dark' ? t.dark : t.light}</span>
                </button>

                {/* Header Notification Bell */}
                <button
                  onClick={() => setNotificationsModalOpen(true)}
                  title="View Announcements & Notifications"
                  className="relative p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-amber-400 border border-slate-700 transition-all flex items-center justify-center"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                  {announcements.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black rounded-full h-4 min-w-[16px] px-1 flex items-center justify-center animate-pulse border border-[#001A40]">
                      {announcements.length}
                    </span>
                  )}
                </button>

                <select
                  value={currency}
                  onChange={(e) => setCurrency(e.target.value)}
                  className="bg-slate-800 text-amber-400 text-xs font-bold px-2.5 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400"
                >
                  <option value="RWF">🇷🇼 RWF</option>
                  <option value="USD">🇺🇸 USD ($)</option>
                  <option value="KES">🇰🇪 KES (KSh)</option>
                  <option value="UGX">🇺🇬 UGX (USh)</option>
                  <option value="EUR">🇪🇺 EUR (€)</option>
                </select>

                <button
                  onClick={() => { setSelectedTierForDeposit(TIERS_DATA[2]); setDepositModalOpen(true); }}
                  className="bg-gradient-to-r from-[#E5A93B] to-amber-400 text-[#001A40] px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold shadow-md hover:brightness-110 active:scale-95 transition-all"
                >
                  {t.deposit}
                </button>
              </div>
            </div>

            {/* Mobile Tab Bar */}
            <div className="md:hidden flex border-t border-slate-800 bg-slate-900/90 px-2 py-1 justify-around text-xs font-bold text-slate-400">
              <button onClick={() => setActiveTab('dashboard')} className={`py-1.5 px-2 ${activeTab === 'dashboard' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>{t.dashboard}</button>
              <button onClick={() => setActiveTab('cycles')} className={`py-1.5 px-2 ${activeTab === 'cycles' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>{t.cycles}</button>
              <button onClick={() => setActiveTab('withdraw')} className={`py-1.5 px-2 ${activeTab === 'withdraw' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>{t.withdrawals}</button>
              <button onClick={() => setActiveTab('admin')} className={`py-1.5 px-2 ${activeTab === 'admin' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>{t.admin}</button>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-20 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-bold text-sm flex items-center gap-2 transition-all transform animate-bounce ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
              <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Announcements Banner */}
          <div
            onClick={() => setNotificationsModalOpen(true)}
            className="cursor-pointer bg-gradient-to-r from-amber-500/15 via-amber-400/10 to-amber-500/15 border-b border-amber-500/30 px-4 py-2.5 hover:bg-amber-400/20 transition-all text-slate-800 dark:text-amber-200"
          >
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm font-semibold">
              <div className="flex items-center gap-2 overflow-hidden">
                <span className="bg-amber-500 text-slate-950 text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full flex items-center gap-1">
                  <span>📢</span>
                  <span>Notice</span>
                </span>
                <span className="truncate">{announcements[0]?.title} — {announcements[0]?.content}</span>
                <span className="text-[11px] text-blue-600 dark:text-amber-300 font-bold underline whitespace-nowrap ml-1">View Details ↗</span>
              </div>
              <span className="hidden sm:inline-block text-xs font-bold text-amber-700 dark:text-amber-300 ml-4 whitespace-nowrap">
                Reserve: {formatMoney(reserveFund)}
              </span>
            </div>
          </div>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'dashboard' && (
              <DashboardView
                formatMoney={formatMoney}
                reserveFund={reserveFund}
                totalDeposited={totalDeposited}

    // UNIFIED STATUS INDICATOR COMPONENT (Processing, Maturing, Completed, Flagged)
    function StatusIndicator({ status, mode = 'badge', text = null }) {
      const normalized = (() => {
        const s = (status || '').toString().toUpperCase();
        if (s.includes('MATUR') || s === 'ACTIVE') return 'Maturing';
        if (s.includes('PROCESS') || s === 'PENDING' || s === 'INITIATED') return 'Processing';
        if (s.includes('COMPLET') || s === 'APPROVED' || s === 'PAID' || s === 'SUCCESS' || s === 'MATURED') return 'Completed';
        if (s.includes('FLAG') || s === 'REJECT' || s === 'FAILED' || s === 'REVIEW' || s === 'HOLD') return 'Flagged';
        return 'Processing';
      })();

      const configs = {
        Processing: {
          label: text || 'Processing',
          icon: '⏳',
          dotClass: 'bg-amber-500 animate-pulse',
          badgeClass: 'bg-amber-100 dark:bg-amber-950/80 text-amber-800 dark:text-amber-300 border-amber-300 dark:border-amber-700/80',
          iconBoxClass: 'bg-amber-100 dark:bg-amber-950/80 text-amber-600 dark:text-amber-400 border-amber-300 dark:border-amber-700/80 shadow-amber-500/20',
          description: 'Transaction in verification queue (1-10m)'
        },
        Maturing: {
          label: text || 'Maturing (72h)',
          icon: '⚡',
          dotClass: 'bg-blue-500 animate-pulse',
          badgeClass: 'bg-blue-100 dark:bg-blue-950/80 text-blue-800 dark:text-blue-300 border-blue-300 dark:border-blue-700/80',
          iconBoxClass: 'bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 border-blue-300 dark:border-blue-700/80 shadow-blue-500/20',
          description: 'Accruing 2.0% high-yield interest in locked vault'
        },
        Completed: {
          label: text || 'Completed',
          icon: '✅',
          dotClass: 'bg-emerald-500',
          badgeClass: 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700/80',
          iconBoxClass: 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-700/80 shadow-emerald-500/20',
          description: 'Funds successfully settled & disbursed'
        },
        Flagged: {
          label: text || 'Flagged',
          icon: '🚩',
          dotClass: 'bg-rose-500',
          badgeClass: 'bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300 border-rose-300 dark:border-rose-700/80',
          iconBoxClass: 'bg-rose-100 dark:bg-rose-950/80 text-rose-600 dark:text-rose-400 border-rose-300 dark:border-rose-700/80 shadow-rose-500/20',
          description: 'Under administrative safety review'
        }
      };

      const cfg = configs[normalized];

      if (mode === 'icon') {
        return (
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold border ${cfg.iconBoxClass} shadow-sm transition-transform hover:scale-105`}>
            <span>{cfg.icon}</span>
          </div>
        );
      }

      if (mode === 'full') {
        return (
          <div className="flex items-center gap-3">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold border ${cfg.iconBoxClass} shadow-sm`}>
              <span>{cfg.icon}</span>
            </div>
            <div>
              <span className={`inline-flex items-center gap-1.5 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border tracking-wider ${cfg.badgeClass}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${cfg.dotClass}`}></span>
                <span>{cfg.label}</span>
              </span>
              <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">{cfg.description}</p>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-1.5 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border tracking-wider ${cfg.badgeClass} shadow-sm`}>
          <span>{cfg.icon}</span>
          <span>{cfg.label}</span>
        </span>
      );
    }

                {/* PAYMENT METHOD SELECTOR */}
                <div>
                  <label className="block text-xs font-extrabold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wider">
                    Select Payment Gateway:
                  </label>
                  <div className="grid grid-cols-3 sm:grid-cols-5 gap-2">
                    {[
                      { id: 'momo', label: 'MTN MoMo', icon: '📱', color: 'border-yellow-400' },
                      { id: 'airtel', label: 'Airtel Money', icon: '📱', color: 'border-red-400' },
                      { id: 'card', label: 'Bank Card', icon: '💳', color: 'border-blue-400' },
                      { id: 'bank', label: 'Bank Transfer', icon: '🏦', color: 'border-purple-400' },
                      { id: 'crypto', label: 'USDT Crypto', icon: '💎', color: 'border-emerald-400' }
                    ].map((m) => (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => setPaymentMethod(m.id)}
                        className={`p-2.5 rounded-2xl border text-center flex flex-col items-center justify-center gap-1 transition-all ${
                          paymentMethod === m.id
                            ? 'bg-amber-400/15 border-amber-400 shadow-sm text-slate-900 dark:text-white font-black'
                            : 'bg-slate-50 dark:bg-slate-950/60 border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-400'
                        }`}
                      >
                        <span className="text-xl">{m.icon}</span>
                        <span className="text-[10.5px] leading-tight">{m.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* PAYMENT METHOD DETAILS */}

                {/* 1. MTN MoMo */}
                {paymentMethod === 'momo' && (
                  <div className="bg-amber-500/10 border-2 border-amber-400/60 rounded-2xl p-4 space-y-4">
                    {/* MTN Sub-mode tabs */}
                    <div className="grid grid-cols-3 gap-1.5 bg-amber-200/50 dark:bg-amber-950/60 p-1 rounded-xl">
                      <button
                        type="button"
                        onClick={() => setMomoSubTab('push')}
                        className={`py-1.5 text-[11px] font-extrabold rounded-lg transition-all ${
                          momoSubTab === 'push' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-700 dark:text-slate-300'
                        }`}
                      >
                        ⚡ Instant Push
                      </button>
                      <button
                        type="button"
                        onClick={() => setMomoSubTab('qr')}
                        className={`py-1.5 text-[11px] font-extrabold rounded-lg transition-all ${
                          momoSubTab === 'qr' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-700 dark:text-slate-300'
                        }`}
                      >
                        📷 Scan QR
                      </button>
                      <button
                        type="button"
                        onClick={() => setMomoSubTab('manual')}
                        className={`py-1.5 text-[11px] font-extrabold rounded-lg transition-all ${
                          momoSubTab === 'manual' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-700 dark:text-slate-300'
                        }`}
                      >
                        🔢 USSD Code
                      </button>
                    </div>

                    {momoSubTab === 'push' && (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-bold text-amber-900 dark:text-amber-300">Instant MTN MoMo Prompt:</span>
                          <span className="font-black text-[10px] bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300 px-2 py-0.5 rounded-full">
                            Auto-Approve Supported
                          </span>
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                            Your MTN Rwanda Number:
                          </label>
                          <input
                            type="text"
                            placeholder="+250 788 123 456"
                            value={phone}
                            onChange={(e) => setPhone(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700/80 rounded-xl px-4 py-2.5 text-sm font-bold text-slate-900 dark:text-white focus:ring-2 focus:ring-amber-400 focus:outline-none"
                          />
                        </div>
                        <p className="text-[11px] text-slate-600 dark:text-slate-300 leading-relaxed">
                          A direct USSD payment prompt of <b>{formatMoney(amount)}</b> will appear immediately on your handset.
                        </p>
                      </div>
                    )}

                    {momoSubTab === 'qr' && (
                      <div className="flex flex-col items-center text-center space-y-3">
                        <div className="relative bg-white p-3 rounded-2xl shadow-md border-2 border-amber-400">
                          <img src={qrDataUrl} alt="MTN QR" className="w-36 h-36 object-contain rounded-lg" />
                          <div className="mt-1 bg-[#001A40] text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">
                            Merchant ID: 1799283
                          </div>
                        </div>
                        <p className="text-xs text-slate-600 dark:text-slate-300">
                          Scan with your MoMo App or phone camera to deposit directly.
                        </p>
                        <div className="flex gap-2 w-full">
                          <a
                            href="tel:*182*8*1*1799283%23"
                            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-extrabold shadow flex items-center justify-center gap-1"
                          >
                            <span>📞</span>
                            <span>Tap to Dial</span>
                          </a>
                          <button
                            type="button"
                            onClick={() => copyToClipboard(merchantCode, 'merchant')}
                            className="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 py-2 rounded-xl text-xs font-extrabold"
                          >
                            {copiedText === 'merchant' ? '✅ Copied!' : '📋 Copy ID (1799283)'}
                          </button>
                        </div>
                      </div>
                    )}

                    {momoSubTab === 'manual' && (
                      <div className="space-y-3 text-xs">
                        <div className="flex items-center justify-between bg-white dark:bg-slate-900 p-3 rounded-xl border border-amber-300 dark:border-amber-700">
                          <span className="text-lg font-black font-mono text-blue-900 dark:text-amber-400">
                            *182*8*1*1799283#
                          </span>
                          <button
                            type="button"
                            onClick={() => copyToClipboard(ussdString, 'ussd')}
                            className="px-3 py-1 bg-amber-400 text-slate-950 font-black rounded-lg text-xs"
                          >
                            {copiedText === 'ussd' ? '✅ Copied' : '📋 Copy Code'}
                          </button>
                        </div>
                        <div className="space-y-1 text-slate-600 dark:text-slate-300">
                          <div>🏢 Merchant: <b>SMART FUTURE CAPITAL</b></div>
                          <div>🔢 Code: <b>1799283</b></div>
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                            MoMo SMS Transaction ID:
                          </label>
                          <input
                            type="text"
                            placeholder="e.g. TXN89327110 or 12389102"
                            value={txId}
                            onChange={(e) => setTxId(e.target.value)}
                            className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 font-mono text-xs font-bold text-slate-900 dark:text-white"
                          />
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 2. Airtel Money */}
                {paymentMethod === 'airtel' && (
                  <div className="bg-red-500/10 border-2 border-red-400/60 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-red-900 dark:text-red-300">Airtel Money Instant Gateway:</span>
                      <span className="font-black text-[10px] bg-red-100 dark:bg-red-900/60 text-red-800 dark:text-red-300 px-2 py-0.5 rounded-full">

                      />

                    <div className="flex items-center justify-between bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-red-200 dark:border-red-800 text-xs">

                      <a href="tel:*182*8*1*1799283%23" className="text-red-600 dark:text-red-400 font-bold underline">Dial Now ↗</a>
                    </div>

                )}

                {paymentMethod === 'card' && (

                      <span className="font-bold text-blue-900 dark:text-blue-300">💳 Card Checkout (Visa / Mastercard):</span>

                      </span>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">

                      <input
                        type="text"
                        placeholder="4242 •••• •••• 4242"
                        value={cardNumber}
                        onChange={(e) => handleFormatCardNumber(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-blue-300 dark:border-blue-700/80 rounded-xl px-4 py-2 text-sm font-mono font-bold text-slate-900 dark:text-white"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          Expiry (MM/YY):
                        </label>
                        <input
                          type="text"
                          placeholder="MM/YY"
                          value={cardExpiry}
                          onChange={(e) => handleFormatExpiry(e.target.value)}
                          className="w-full bg-white dark:bg-slate-900 border border-blue-300 dark:border-blue-700/80 rounded-xl px-4 py-2 text-sm font-mono font-bold text-slate-900 dark:text-white"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                          CVC / CVV:
                        </label>
                        <input
                          type="password"
                          maxLength="4"
                          placeholder="123"
                          value={cardCvc}
                          onChange={(e) => setCardCvc(e.target.value.replace(/\D/g, ''))}
                          className="w-full bg-white dark:bg-slate-900 border border-blue-300 dark:border-blue-700/80 rounded-xl px-4 py-2 text-sm font-mono font-bold text-slate-900 dark:text-white"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Cardholder Name:
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. JOHN DOE"
                        value={cardHolder}
                        onChange={(e) => setCardHolder(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-blue-300 dark:border-blue-700/80 rounded-xl px-4 py-2 text-sm font-bold text-slate-900 dark:text-white uppercase"
                      />
                    </div>
                  </div>
                )}

                {/* 4. Bank Transfer */}
                {paymentMethod === 'bank' && (
                  <div className="bg-purple-500/10 border-2 border-purple-400/60 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-purple-900 dark:text-purple-300">🏦 Rwandan Bank Wire / Cash Deposit:</span>
                      <span className="font-black text-[10px] bg-purple-100 dark:bg-purple-900/60 text-purple-800 dark:text-purple-300 px-2 py-0.5 rounded-full">
                        Same-Day Credit
                      </span>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">Select Bank:</label>
                      <select
                        value={selectedBank}
                        onChange={(e) => setSelectedBank(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-purple-300 dark:border-purple-700/80 rounded-xl px-4 py-2 text-xs font-bold text-slate-900 dark:text-white"
                      >
                        <option value="Bank of Kigali (BK)">Bank of Kigali (BK)</option>
                        <option value="BPR Bank Rwanda">BPR Bank Rwanda</option>
                        <option value="Equity Bank Rwanda">Equity Bank Rwanda</option>
                        <option value="I&M Bank Rwanda">I&M Bank Rwanda</option>
                      </select>
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-3 rounded-xl border border-purple-200 dark:border-purple-800 text-xs space-y-1">
                      <div className="flex justify-between">
                        <span className="text-slate-500">Account Name:</span>
                        <span className="font-extrabold text-slate-900 dark:text-white">SMART FUTURE CAPITAL LTD</span>
                      </div>
                      <div className="flex justify-between items-center">
                        <span className="text-slate-500">Account No:</span>
                        <div className="flex items-center gap-1.5">
                          <span className="font-mono font-black text-purple-700 dark:text-purple-400">00045-098234-88</span>
                          <button
                            type="button"
                            onClick={() => copyToClipboard('00045-098234-88', 'bankAcc')}
                            className="text-[10px] bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded font-bold"
                          >
                            {copiedText === 'bankAcc' ? 'Copied' : 'Copy'}
                          </button>
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Bank Deposit Slip / Reference Number:
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. BK-REF-902188"
                        value={bankRef}
                        onChange={(e) => setBankRef(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-purple-300 dark:border-purple-700/80 rounded-xl px-4 py-2 font-mono text-xs font-bold text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>
                )}

                {/* 5. Crypto USDT */}
                {paymentMethod === 'crypto' && (
                  <div className="bg-emerald-500/10 border-2 border-emerald-400/60 rounded-2xl p-4 space-y-3">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-emerald-900 dark:text-emerald-300">💎 Crypto USDT Direct Deposit:</span>
                      <span className="font-black text-[10px] bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-300 px-2 py-0.5 rounded-full">
                        ~{(amount / 1400).toFixed(2)} USDT
                      </span>
                    </div>

                    <div className="flex gap-2">
                      {['USDT-TRC20', 'USDT-BEP20'].map((net) => (
                        <button
                          key={net}
                          type="button"
                          onClick={() => setCryptoNetwork(net)}
                          className={`flex-1 py-1.5 text-xs font-black rounded-lg border transition-all ${
                            cryptoNetwork === net
                              ? 'bg-emerald-500 text-white border-emerald-600 shadow'
                              : 'bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700'
                          }`}
                        >
                          {net}
                        </button>
                      ))}
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-3 rounded-xl border border-emerald-300 dark:border-emerald-700 flex items-center justify-between gap-2 text-xs">
                      <div className="truncate font-mono font-bold text-emerald-800 dark:text-emerald-300">
                        {cryptoAddress}
                      </div>
                      <button
                        type="button"
                        onClick={() => copyToClipboard(cryptoAddress, 'crypto')}
                        className="px-2.5 py-1 bg-emerald-500 text-white font-bold rounded-lg text-xs whitespace-nowrap shadow"
                      >
                        {copiedText === 'crypto' ? '✅ Copied' : '📋 Copy'}
                      </button>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1">
                        Blockchain Tx Hash:
                      </label>
                      <input
                        type="text"
                        placeholder="0x... or TRC20 Hash"
                        value={cryptoTxHash}
                        onChange={(e) => setCryptoTxHash(e.target.value)}
                        className="w-full bg-white dark:bg-slate-900 border border-emerald-300 dark:border-emerald-700 rounded-xl px-4 py-2 font-mono text-xs font-bold text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>
                )}

                {/* Action Buttons */}
                <div className="pt-2 flex gap-3">
                  <button
                    type="button"
                    onClick={onClose}
                    className="w-1/3 py-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-xs sm:text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={triggerPaymentFlow}
                    className="w-2/3 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black text-xs sm:text-sm shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2"
                  >
                    <span>⚡ Pay {formatMoney(amount)} & Start</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
