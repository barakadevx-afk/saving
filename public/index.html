<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART FUTURE CAPITAL (SFC) | React JSX & Cloud Web Platform</title>
  <meta name="description" content="SMART FUTURE CAPITAL (SFC) - Automated 3-Day High-Yield Micro-Savings & Liquidity Growth Platform. React JSX Frontend with Serverless Cloud Backend." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#001A40',
              gold: '#E5A93B',
              goldDark: '#B45309',
              blue: '#005AC1',
              green: '#10B981',
              card: '#FFFFFF',
              darkCard: '#0F172A',
              bgLight: '#F8FAFC',
              bgDark: '#020617'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for standalone JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React JSX Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TIERS_DATA = [
      { id: 'tier_a', name: 'Tier A - Starter', minAmount: 6000, durationDays: 3, rate: 0.02, desc: 'Quick 3-day liquidity test', badge: 'Starter' },
      { id: 'tier_b', name: 'Tier B - Silver Growth', minAmount: 10000, durationDays: 3, rate: 0.02, desc: 'Standard 3-day capital accelerator', badge: 'Popular' },
      { id: 'tier_c', name: 'Tier C - Gold Master', minAmount: 15000, durationDays: 3, rate: 0.02, desc: 'Most popular community choice', badge: 'Featured' },
      { id: 'tier_d', name: 'Tier D - Platinum VIP', minAmount: 45000, durationDays: 3, rate: 0.02, desc: 'Maximum yield for high-volume savings', badge: 'High Yield' }
    ];

    const CURRENCIES = {
      RWF: { symbol: 'RWF', rate: 1 },
      USD: { symbol: '$', rate: 0.00073 },
      KES: { symbol: 'KSh', rate: 0.095 },
      UGX: { symbol: 'USh', rate: 2.72 },
      EUR: { symbol: '€', rate: 0.00067 }
    };

    function App() {
      const [currency, setCurrency] = useState('RWF');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [reserveFund, setReserveFund] = useState(20000000);
      const [userCycles, setUserCycles] = useState(() => {
        const saved = localStorage.getItem('sfc_cycles');
        return saved ? JSON.parse(saved) : [
          {
            id: 'CYC-1001',
            tierName: 'Tier C - Gold Master',
            depositAmount: 15000,
            interestRate: 0.02,
            profit: 300,
            totalPayout: 15300,
            startedAt: Date.now() - (1.5 * 86400000),
            maturityDate: Date.now() + (1.5 * 86400000),
            status: 'ACTIVE'
          }
        ];
      });

      const [deposits, setDeposits] = useState(() => {
        const saved = localStorage.getItem('sfc_deposits');
        return saved ? JSON.parse(saved) : [
          { id: 'DEP-8841', phone: '+250788123456', amount: 15000, momoTxId: 'TXN89327110', status: 'APPROVED', time: '1 day ago' }
        ];
      });

      const [withdrawals, setWithdrawals] = useState(() => {
        const saved = localStorage.getItem('sfc_withdrawals');
        return saved ? JSON.parse(saved) : [
          { id: 'WTH-3021', phone: '+250788123456', amount: 15300, status: 'PENDING', time: '4 hours ago' }
        ];
      });

      const [announcements, setAnnouncements] = useState([
        { id: '1', title: '🛡️ 20,000,000 RWF Capital Reserve Backing', content: 'All user 3-day savings cycles are 100% insured against loss.', urgent: false },
        { id: '2', title: '⚡ MoMo Merchant Deposit Activated', content: 'Direct merchant code *182*8*1*1799283# deposits are credited instantly.', urgent: false }
      ]);

      const [depositModalOpen, setDepositModalOpen] = useState(false);
      const [selectedTierForDeposit, setSelectedTierForDeposit] = useState(TIERS_DATA[2]);
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        localStorage.setItem('sfc_cycles', JSON.stringify(userCycles));
      }, [userCycles]);

      useEffect(() => {
        localStorage.setItem('sfc_deposits', JSON.stringify(deposits));
      }, [deposits]);

      useEffect(() => {
        localStorage.setItem('sfc_withdrawals', JSON.stringify(withdrawals));
      }, [withdrawals]);

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const formatMoney = (rwfAmount) => {
        const cur = CURRENCIES[currency];
        const val = rwfAmount * cur.rate;
        if (currency === 'RWF') return Math.round(val).toLocaleString() + ' RWF';
        return cur.symbol + val.toFixed(2);
      };

      const totalDeposited = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.depositAmount, 0);
      }, [userCycles]);

      const totalEarned = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.profit, 0);
      }, [userCycles]);

      const handleStartCycle = (tier, customAmount = null) => {
        const amount = customAmount || tier.minAmount;
        const profit = Math.round(amount * tier.rate);
        const newCycle = {
          id: 'CYC-' + Math.floor(1000 + Math.random() * 9000),
          tierName: tier.name,
          depositAmount: amount,
          interestRate: tier.rate,
          profit: profit,
          totalPayout: amount + profit,
          startedAt: Date.now(),
          maturityDate: Date.now() + (tier.durationDays * 86400000),
          status: 'ACTIVE'
        };
        setUserCycles([newCycle, ...userCycles]);
        showToast(`🎉 3-Day Savings Cycle Activated for ${formatMoney(amount)}!`);
      };

      const handleDepositSubmit = (formData) => {
        const newDep = {
          id: 'DEP-' + Math.floor(1000 + Math.random() * 9000),
          phone: formData.phone,
          amount: Number(formData.amount),
          momoTxId: formData.txId,
          status: 'APPROVED',
          time: 'Just now'
        };
        setDeposits([newDep, ...deposits]);
        handleStartCycle(formData.tier, Number(formData.amount));
        setDepositModalOpen(false);
      };

      const handleWithdrawSubmit = (phone, amount) => {
        const numAmount = Number(amount);
        if (!phone || numAmount <= 0) {
          showToast('Please enter a valid phone and amount', 'error');
          return;
        }
        const newWth = {
          id: 'WTH-' + Math.floor(1000 + Math.random() * 9000),
          phone,
          amount: numAmount,
          status: 'PENDING',
          time: 'Just now'
        };
        setWithdrawals([newWth, ...withdrawals]);
        showToast(`🚀 Withdrawal request of ${formatMoney(numAmount)} submitted to ${phone}!`);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#001A40] text-white shadow-lg border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#E5A93B] to-amber-300 text-[#001A40] flex items-center justify-center font-extrabold text-xl shadow-md">
                  SFC
                </div>
                <div>
                  <div className="font-extrabold text-lg tracking-tight leading-none text-white">SMART FUTURE CAPITAL</div>
                  <div className="text-xs text-amber-400 font-semibold tracking-wider">3-DAY HIGH YIELD VAULT</div>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('cycles')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'cycles' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Active Cycles ({userCycles.length})
                </button>
                <button
                  onClick={() => setActiveTab('withdraw')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'withdraw' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Withdrawals
                </button>
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'admin' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Admin Hub
                </button>
              </nav>

              {/* Action and Currency */}
              <div className="flex items-center gap-3">
                <select
                  value={currency}
                  onChange={(e) => setCurrency(e.target.value)}
                  className="bg-slate-800 text-amber-400 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400"
                >
                  <option value="RWF">🇷🇼 RWF</option>
                  <option value="USD">🇺🇸 USD ($)</option>
                  <option value="KES">🇰🇪 KES (KSh)</option>
                  <option value="UGX">🇺🇬 UGX (USh)</option>
                  <option value="EUR">🇪🇺 EUR (€)</option>
                </select>

                <button
                  onClick={() => { setSelectedTierForDeposit(TIERS_DATA[2]); setDepositModalOpen(true); }}
                  className="bg-gradient-to-r from-[#E5A93B] to-amber-400 text-[#001A40] px-4 py-2 rounded-xl text-sm font-extrabold shadow-md hover:brightness-110 active:scale-95 transition-all"
                >
                  + Deposit
                </button>
              </div>
            </div>

            {/* Mobile Tab Bar */}
            <div className="md:hidden flex border-t border-slate-800 bg-slate-900/90 px-2 py-1 justify-around text-xs font-bold text-slate-400">
              <button onClick={() => setActiveTab('dashboard')} className={`py-1.5 px-2 ${activeTab === 'dashboard' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Dashboard</button>
              <button onClick={() => setActiveTab('cycles')} className={`py-1.5 px-2 ${activeTab === 'cycles' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Cycles</button>
              <button onClick={() => setActiveTab('withdraw')} className={`py-1.5 px-2 ${activeTab === 'withdraw' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Withdraw</button>
              <button onClick={() => setActiveTab('admin')} className={`py-1.5 px-2 ${activeTab === 'admin' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Admin</button>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-20 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-bold text-sm flex items-center gap-2 transition-all transform animate-bounce ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
              <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Announcements Banner */}
          <div className="bg-gradient-to-r from-amber-500/15 via-amber-400/10 to-amber-500/15 border-b border-amber-500/30 px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-800">
              <div className="flex items-center gap-2 overflow-hidden">
                <span className="bg-amber-500 text-slate-950 text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full">Reserve Protected</span>
                <span className="truncate">{announcements[0]?.title} — {announcements[0]?.content}</span>
              </div>
              <span className="hidden sm:inline-block text-xs font-bold text-amber-700 ml-4 whitespace-nowrap">
                Reserve: {formatMoney(reserveFund)}
              </span>
            </div>
          </div>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'dashboard' && (
              <DashboardView
                formatMoney={formatMoney}
                reserveFund={reserveFund}
                totalDeposited={totalDeposited}
                totalEarned={totalEarned}
                activeCyclesCount={userCycles.length}
                tiers={TIERS_DATA}
                onSelectTier={(tier) => { setSelectedTierForDeposit(tier); setDepositModalOpen(true); }}
                userCycles={userCycles}
              />
            )}

            {activeTab === 'cycles' && (
              <CyclesView
                cycles={userCycles}
                formatMoney={formatMoney}
                onOpenDeposit={() => { setSelectedTierForDeposit(TIERS_DATA[2]); setDepositModalOpen(true); }}
              />
            )}

            {activeTab === 'withdraw' && (
              <WithdrawView
                withdrawals={withdrawals}
                formatMoney={formatMoney}
                availableBalance={totalDeposited + totalEarned}
                onSubmitWithdraw={handleWithdrawSubmit}
              />
            )}

            {activeTab === 'admin' && (
              <AdminHubView
                reserveFund={reserveFund}
                onUpdateReserve={setReserveFund}
                deposits={deposits}
                withdrawals={withdrawals}
                cycles={userCycles}
                formatMoney={formatMoney}
                announcements={announcements}
                onAddAnnouncement={(ann) => setAnnouncements([ann, ...announcements])}
              />
            )}
          </main>

          {/* Deposit Modal */}
          {depositModalOpen && (
            <DepositModal
              tier={selectedTierForDeposit}
              formatMoney={formatMoney}
              onClose={() => setDepositModalOpen(false)}
              onSubmit={handleDepositSubmit}
            />
          )}

          {/* Footer */}
          <footer className="bg-[#001A40] text-slate-400 border-t border-slate-800 py-8 px-4 text-center text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                <span className="font-bold text-slate-200">SMART FUTURE CAPITAL (SFC) React JSX Cloud Engine</span>
              </div>
              <div className="text-slate-400">
                Deployed on Vercel Global Edge Network • Backed by 20M RWF Reserve
              </div>
              <div>
                © 2026 SFC Ltd. All rights reserved.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // DASHBOARD VIEW
    function DashboardView({ formatMoney, reserveFund, totalDeposited, totalEarned, activeCyclesCount, tiers, onSelectTier, userCycles }) {
      const [calcPrincipal, setCalcPrincipal] = useState(15000);
      const [calcCycles, setCalcCycles] = useState(5);

      const calcYield = useMemo(() => {
        const singleCycle = calcPrincipal * 0.02;
        const totalProfit = singleCycle * calcCycles;
        return {
          single: singleCycle,
          totalProfit: totalProfit,
          totalPayout: calcPrincipal + totalProfit,
          days: calcCycles * 3
        };
      }, [calcPrincipal, calcCycles]);

      return (
        <div className="space-y-8">
          {/* Hero Bento Banner */}
          <div className="bg-gradient-to-br from-[#001A40] via-[#05285D] to-[#001433] rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden border border-slate-700/60">
            <div className="absolute top-0 right-0 w-96 h-96 bg-amber-400/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="relative z-10 max-w-3xl space-y-4">
              <div className="inline-flex items-center gap-2 bg-amber-400/20 text-amber-300 px-3.5 py-1.5 rounded-full text-xs font-extrabold border border-amber-400/30">
                <span>🛡️</span> Insured Liquidity Reserve: {formatMoney(reserveFund)}
              </div>
              
              <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                Automated <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">3-Day High-Yield</span> Savings Cycles
              </h1>
              
              <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                Deposit safely into automated fixed-yield 3-day micro-cycles. Earn guaranteed 2.0% returns with instant MTN & Airtel Mobile Money settlements.
              </p>

              <div className="pt-2 flex flex-wrap gap-4">
                <button
                  onClick={() => onSelectTier(tiers[2])}
                  className="bg-gradient-to-r from-[#E5A93B] to-amber-400 text-[#001A40] px-6 py-3 rounded-xl font-extrabold shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm"
                >
                  🚀 Start 3-Day Cycle ({formatMoney(15000)})
                </button>
                <a
                  href="#calculator-section"
                  className="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-6 py-3 rounded-xl font-bold transition-all text-sm flex items-center gap-2"
                >
                  <span>📈</span> Calculate Earnings
                </a>
              </div>
            </div>

            {/* Quick Metrics Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 pt-8 border-t border-slate-700/60">
              <div>
                <div className="text-xs text-slate-400 font-semibold">Active Deposits</div>
                <div className="text-xl sm:text-2xl font-extrabold text-white mt-1">{formatMoney(totalDeposited)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Total Yield Accrued</div>
                <div className="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-1">+{formatMoney(totalEarned)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Active Cycles</div>
                <div className="text-xl sm:text-2xl font-extrabold text-amber-400 mt-1">{activeCyclesCount} Active</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Lock Duration</div>
                <div className="text-xl sm:text-2xl font-extrabold text-blue-300 mt-1">3 Days Fixed</div>
              </div>
            </div>
          </div>

          {/* Available Savings Tiers */}
          <div>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900">Choose a Savings Tier</h2>
                <p className="text-xs sm:text-sm text-slate-500 font-medium">Select a deposit tier to start compounding returns every 72 hours</p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              {tiers.map((tier) => {
                const profit = Math.round(tier.minAmount * tier.rate);
                const isFeatured = tier.id === 'tier_c';
                return (
                  <div
                    key={tier.id}
                    className={`bg-white rounded-2xl p-6 border transition-all hover:shadow-xl flex flex-col justify-between relative ${isFeatured ? 'border-amber-400 ring-2 ring-amber-400/20 shadow-md' : 'border-slate-200'}`}
                  >
                    {isFeatured && (
                      <span className="absolute -top-3 right-4 bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-full shadow">
                        ⭐ Most Savers Choice
                      </span>
                    )}

                    <div>
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{tier.badge}</div>
                      <h3 className="text-lg font-extrabold text-slate-900 mt-1">{tier.name}</h3>
                      <p className="text-xs text-slate-500 mt-1">{tier.desc}</p>

                      <div className="my-5 p-3.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1.5">
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">Deposit Principal:</span>
                          <span className="font-extrabold text-slate-900">{formatMoney(tier.minAmount)}</span>
                        </div>
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">Lock Duration:</span>
                          <span className="font-bold text-blue-600">3 Days (72h)</span>
                        </div>
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">3-Day Profit (+2.0%):</span>
                          <span className="font-extrabold text-emerald-600">+{formatMoney(profit)}</span>
                        </div>
                        <div className="pt-1.5 border-t border-slate-200 flex justify-between text-xs font-extrabold">
                          <span className="text-slate-700">Total Matured Payout:</span>
                          <span className="text-slate-950">{formatMoney(tier.minAmount + profit)}</span>
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={() => onSelectTier(tier)}
                      className={`w-full py-2.5 rounded-xl font-extrabold text-sm transition-all shadow-sm ${isFeatured ? 'bg-[#001A40] text-amber-400 hover:bg-[#05285D]' : 'bg-slate-100 hover:bg-slate-200 text-slate-900'}`}
                    >
                      Deposit {formatMoney(tier.minAmount)}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Interactive Yield Calculator & MoMo Deposit Guide */}
          <div id="calculator-section" className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {/* Calculator Card */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl font-bold">
                  📈
                </div>
                <div>
                  <h3 className="text-lg font-extrabold text-slate-900">Compound Yield Calculator</h3>
                  <p className="text-xs text-slate-500">Estimate profits across consecutive 3-day micro cycles</p>
                </div>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Deposit Principal (RWF):</label>
                  <input
                    type="number"
                    value={calcPrincipal}
                    onChange={(e) => setCalcPrincipal(Number(e.target.value))}
                    step="1000"
                    min="1000"
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 font-extrabold text-slate-900 focus:ring-2 focus:ring-amber-400 focus:outline-none"

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Number of Consecutive Cycles:</label>
                  <select
                    value={calcCycles}
                    onChange={(e) => setCalcCycles(Number(e.target.value))}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 font-bold text-slate-900 focus:ring-2 focus:ring-amber-400 focus:outline-none"
                  >
                    <option value="1">1 Cycle (3 Days)</option>
                    <option value="2">2 Cycles (6 Days)</option>
                    <option value="3">3 Cycles (9 Days)</option>
                    <option value="5">5 Cycles (15 Days)</option>

                  </select>
                </div>

                {/* Calculation Output Box */}
                <div className="bg-[#001A40] text-white p-5 rounded-2xl mt-4 space-y-3">
                  <div className="flex justify-between text-xs text-slate-300">

                    <span>Estimated Net Profit:</span>
                    <span className="font-extrabold text-emerald-400">+{formatMoney(calcYield.totalProfit)}</span>
                  </div>
                  <div className="pt-2 border-t border-slate-700 flex justify-between items-baseline">
                    <span className="text-xs font-semibold text-slate-300">Total Maturity Value:</span>
                    <span className="text-2xl font-extrabold text-amber-400">{formatMoney(calcYield.totalPayout)}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* MoMo Merchant Instructions */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md flex flex-col justify-between">
              <div>
                <div className="flex items-center gap-3 mb-6">
                  <div className="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center text-xl font-bold">
                    💳
                  </div>
                  <div>
                    <h3 className="text-lg font-extrabold text-slate-900">Instant MTN MoMo Deposition</h3>
                    <p className="text-xs text-slate-500">Official verified merchant deposition instructions</p>
                  </div>
                </div>

                <div className="bg-blue-50/70 border border-blue-200 rounded-2xl p-4 mb-4">
                  <div className="text-xs font-bold text-blue-900 uppercase tracking-wider">MTN Mobile Money Merchant Code:</div>
                  <div className="text-2xl font-black text-blue-700 font-mono mt-1 select-all bg-blue-100/80 px-3 py-1.5 rounded-lg inline-block">
                    *182*8*1*1799283#
                  </div>
                  <div className="text-xs text-blue-600 font-semibold mt-2">
                    Merchant Name: SMART FUTURE CAPITAL Ltd.
                  </div>
                </div>

                <ol className="text-xs text-slate-600 space-y-2 list-decimal list-inside font-medium leading-relaxed">
                  <li>Dial the MTN merchant code or use Airtel Money transfer.</li>
                  <li>Enter the required Tier deposit amount (e.g. 15,000 RWF).</li>
                  <li>Confirm recipient is <strong className="text-slate-900">SMART FUTURE CAPITAL</strong> and input your PIN.</li>
                  <li>Copy the SMS Transaction ID and click the Deposit button to activate.</li>
                </ol>
              </div>

              <div className="mt-6 pt-4 border-t border-slate-100">
                <button
                  onClick={() => onSelectTier(tiers[2])}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl shadow transition-all text-sm flex items-center justify-center gap-2"
                >
                  <span>✅</span> Submit MoMo Transaction ID
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // CYCLES VIEW
    function CyclesView({ cycles, formatMoney, onOpenDeposit }) {
      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-900">Your Active Savings Cycles</h2>
              <p className="text-xs sm:text-sm text-slate-500 font-medium">All active 72-hour liquidity locks and accrued interest</p>
            </div>
            <button
              onClick={onOpenDeposit}
              className="bg-[#001A40] text-amber-400 px-5 py-2.5 rounded-xl font-extrabold text-sm shadow hover:bg-[#05285D] transition-all"
            >
              + Start New Cycle
            </button>
          </div>

          {cycles.length === 0 ? (
            <div className="bg-white rounded-3xl p-12 text-center border border-slate-200 shadow-sm space-y-4">
              <div className="text-5xl">⏳</div>
              <h3 className="text-lg font-extrabold text-slate-800">No Active Savings Cycles Yet</h3>
              <p className="text-xs text-slate-500 max-w-sm mx-auto">Start a 3-day savings cycle now to lock in your 2.0% returns.</p>
              <button
                onClick={onOpenDeposit}
                className="bg-amber-400 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl text-sm shadow hover:bg-amber-300 transition-all"
              >
                Explore Tiers & Deposit
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {cycles.map((c) => {
                const now = Date.now();
                const totalDuration = c.maturityDate - c.startedAt;
                const elapsed = Math.min(totalDuration, Math.max(0, now - c.startedAt));
                const progressPct = Math.round((elapsed / totalDuration) * 100);
                const remainingMs = Math.max(0, c.maturityDate - now);
                const remainingHours = Math.round(remainingMs / 3600000);

                return (
                  <div key={c.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span className="font-extrabold text-slate-900 text-base">{c.tierName}</span>
                      </div>
                      <span className="text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                        {c.id}
                      </span>
                    </div>

                    <div className="grid grid-cols-3 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                      <div>
                        <div className="text-[10px] text-slate-400 font-semibold">Principal</div>
                        <div className="font-extrabold text-xs text-slate-900 mt-0.5">{formatMoney(c.depositAmount)}</div>
                      </div>
                      <div>
                        <div className="text-[10px] text-slate-400 font-semibold">Yield (+2.0%)</div>
                        <div className="font-extrabold text-xs text-emerald-600 mt-0.5">+{formatMoney(c.profit)}</div>
                      </div>
                      <div>
                        <div className="text-[10px] text-slate-400 font-semibold">Total Payout</div>
                        <div className="font-extrabold text-xs text-slate-950 mt-0.5">{formatMoney(c.totalPayout)}</div>
                      </div>
                    </div>

                    <div>
                      <div className="flex justify-between text-xs font-semibold mb-1">
                        <span className="text-slate-500">Maturity Progress:</span>
                        <span className="text-blue-600 font-bold">{progressPct}% ({remainingHours}h remaining)</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div className="bg-gradient-to-r from-blue-600 to-amber-400 h-2 rounded-full transition-all duration-500" style={{ width: `${progressPct}%` }}></div>
                      </div>
                    </div>

                    <div className="flex items-center justify-between text-xs pt-2 border-t border-slate-100">
                      <span className="text-slate-400">Lock: 3 Days Fixed</span>
                      <span className="text-emerald-600 font-bold">100% Reserve Insured 🛡️</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // WITHDRAW VIEW
    function WithdrawView({ withdrawals, formatMoney, availableBalance, onSubmitWithdraw }) {
      const [phone, setPhone] = useState('');
      const [amount, setAmount] = useState('15000');

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div className="lg:col-span-1 bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md space-y-5">
            <div>
              <h3 className="text-xl font-extrabold text-slate-900">Request Withdrawal</h3>
              <p className="text-xs text-slate-500 font-medium mt-1">Payout directly to your MTN or Airtel Mobile Money</p>
            </div>

            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4">
              <div className="text-xs text-amber-800 font-semibold">Available Liquidity:</div>
              <div className="text-2xl font-black text-slate-900 mt-0.5">{formatMoney(availableBalance)}</div>
            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">MTN / Airtel Phone Number:</label>
                <input
                  type="text"
                  placeholder="+250 788 123 456"
                  value={phone}
                  onChange={(e) => setPhone(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 font-bold text-slate-900 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Withdrawal Amount (RWF):</label>
                <input
                  type="number"
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                  step="1000"
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 font-extrabold text-slate-900 text-sm focus:ring-2 focus:ring-amber-400 focus:outline-none"
                />
              </div>

              <button
                onClick={() => onSubmitWithdraw(phone, amount)}
                className="w-full bg-[#001A40] hover:bg-[#05285D] text-amber-400 font-extrabold py-3 rounded-xl shadow transition-all text-sm"
              >
                Submit MoMo Withdrawal
              </button>
            </div>
          </div>

          <div className="lg:col-span-2 bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md space-y-4">
            <h3 className="text-xl font-extrabold text-slate-900">Withdrawal History</h3>
            <p className="text-xs text-slate-500 font-medium">Recent payouts processed via the liquidity reserve</p>

            <div className="space-y-3 pt-2">
              {withdrawals.map((w) => (
                <div key={w.id} className="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                  <div>
                    <div className="font-extrabold text-sm text-slate-900">{formatMoney(w.amount)}</div>
                    <div className="text-xs text-slate-500">{w.phone} • {w.time}</div>
                  </div>
                  <span className={`text-[10px] font-extrabold px-3 py-1 rounded-full uppercase ${w.status === 'APPROVED' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                    {w.status}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ADMIN HUB VIEW
    function AdminHubView({ reserveFund, onUpdateReserve, deposits, withdrawals, cycles, formatMoney, announcements, onAddAnnouncement }) {
      const [newReserve, setNewReserve] = useState(reserveFund);
      const [annTitle, setAnnTitle] = useState('');
      const [annContent, setAnnContent] = useState('');

      return (
        <div className="space-y-8">
          <div>
            <h2 className="text-2xl font-extrabold text-slate-900">Admin Control Hub</h2>
            <p className="text-xs sm:text-sm text-slate-500 font-medium">Manage platform reserves, announcements, and transaction auditing</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Reserve Fund Controller */}
            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
              <div className="text-xs font-extrabold text-slate-400 uppercase">Capital Reserve Pool</div>
              <div className="text-2xl font-black text-[#001A40]">{formatMoney(reserveFund)}</div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Update Reserve (RWF):</label>
                <input
                  type="number"
                  value={newReserve}
                  onChange={(e) => setNewReserve(Number(e.target.value))}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold"
                />
              </div>
              <button
                onClick={() => onUpdateReserve(newReserve)}
                className="w-full bg-amber-400 text-slate-950 font-extrabold py-2 rounded-xl text-xs hover:bg-amber-300"
              >
                Save Reserve Pool
              </button>
            </div>

            {/* Platform Broadcast */}
            <div className="md:col-span-2 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
              <div className="text-xs font-extrabold text-slate-400 uppercase">Broadcast System Announcement</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input
                  type="text"
                  placeholder="Announcement Title"
                  value={annTitle}
                  onChange={(e) => setAnnTitle(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold"
                />
                <input
                  type="text"
                  placeholder="Announcement Details"
                  value={annContent}
                  onChange={(e) => setAnnContent(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium"
                />
              </div>
              <button
                onClick={() => {
                  if (annTitle) {
                    onAddAnnouncement({ id: Date.now().toString(), title: annTitle, content: annContent, urgent: false });
                    setAnnTitle('');
                    setAnnContent('');
                  }
                }}
                className="bg-[#001A40] text-amber-400 font-extrabold px-5 py-2 rounded-xl text-xs hover:bg-[#05285D]"
              >
                Publish Announcement
              </button>
            </div>
          </div>
        </div>
      );
    }

    // DEPOSIT MODAL
    function DepositModal({ tier, formatMoney, onClose, onSubmit }) {
      const [phone, setPhone] = useState('');
      const [amount, setAmount] = useState(tier.minAmount);
      const [txId, setTxId] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!txId.trim()) {
          alert('Please enter your MoMo transaction ID');
          return;
        }
        onSubmit({ phone, amount, txId, tier });
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 relative animate-in fade-in zoom-in duration-200">
            <button
              onClick={onClose}
              className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-lg p-2"
            >
              ✕
            </button>

            <div className="space-y-4">
              <div>
                <span className="text-[10px] font-extrabold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full uppercase">3-Day Cycle</span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">Deposit for {tier.name}</h3>
              </div>

              <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl space-y-1">
                <div className="text-xs text-blue-900 font-bold">1. Dial MTN Merchant Code:</div>
                <div className="text-xl font-black font-mono text-blue-700 bg-blue-100 px-3 py-1 rounded-lg inline-block">
                  *182*8*1*1799283#
                </div>
                <div className="text-xs text-blue-700 font-medium">Merchant: SMART FUTURE CAPITAL</div>
              </div>

              <form onSubmit={handleSubmit} className="space-y-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Your MoMo / Airtel Phone Number:</label>
                  <input
                    type="text"
                    required
                    placeholder="+250 788 000 000"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-slate-900 focus:ring-2 focus:ring-amber-400 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Deposit Amount (RWF):</label>
                  <input
                    type="number"
                    required
                    value={amount}
                    onChange={(e) => setAmount(e.target.value)}
                    min={tier.minAmount}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-extrabold text-slate-900 focus:ring-2 focus:ring-amber-400 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">MoMo SMS Transaction ID:</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. TXN89327110"
                    value={txId}
                    onChange={(e) => setTxId(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-mono font-bold text-slate-900 focus:ring-2 focus:ring-amber-400 focus:outline-none"
                  />
                </div>

                <div className="pt-2 flex gap-3">
                  <button
                    type="button"
                    onClick={onClose}
                    className="w-1/2 py-2.5 rounded-xl border border-slate-200 font-bold text-sm text-slate-600 hover:bg-slate-50"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="w-1/2 py-2.5 rounded-xl bg-[#001A40] text-amber-400 font-extrabold text-sm hover:bg-[#05285D] shadow"
                  >
                    Confirm & Start
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
