<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART FUTURE CAPITAL (SFC) | React JSX & Cloud Web Platform</title>
  <meta name="description" content="SMART FUTURE CAPITAL (SFC) - Automated 3-Day High-Yield Micro-Savings & Liquidity Growth Platform. React JSX Frontend with Serverless Cloud Backend." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.svg" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#001A40',
              gold: '#E5A93B',
              goldDark: '#B45309',
              blue: '#005AC1',
              green: '#10B981',
              card: '#FFFFFF',
              darkCard: '#0F172A',
              bgLight: '#F8FAFC',
              bgDark: '#020617'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for standalone JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
  <div id="root"></div>

  <!-- React JSX Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TIERS_DATA = [
      { id: 'tier_a', name: 'Tier A - Starter', minAmount: 6000, durationDays: 3, rate: 0.02, desc: 'Quick 3-day liquidity test', badge: 'Starter' },
      { id: 'tier_b', name: 'Tier B - Silver Growth', minAmount: 10000, durationDays: 3, rate: 0.02, desc: 'Standard 3-day capital accelerator', badge: 'Popular' },
      { id: 'tier_c', name: 'Tier C - Gold Master', minAmount: 15000, durationDays: 3, rate: 0.02, desc: 'Most popular community choice', badge: 'Featured' },
      { id: 'tier_d', name: 'Tier D - Platinum VIP', minAmount: 45000, durationDays: 3, rate: 0.02, desc: 'Maximum yield for high-volume savings', badge: 'High Yield' }
    ];

    const CURRENCIES = {
      RWF: { symbol: 'RWF', rate: 1 },
      USD: { symbol: '$', rate: 0.00073 },
      KES: { symbol: 'KSh', rate: 0.095 },
      UGX: { symbol: 'USh', rate: 2.72 },
      EUR: { symbol: '€', rate: 0.00067 }
    };

    function App() {
      const [currency, setCurrency] = useState('RWF');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [reserveFund, setReserveFund] = useState(20000000);
      const [userCycles, setUserCycles] = useState(() => {
        const saved = localStorage.getItem('sfc_cycles');
        return saved ? JSON.parse(saved) : [
          {
            id: 'CYC-1001',
            tierName: 'Tier C - Gold Master',
            depositAmount: 15000,
            interestRate: 0.02,
            profit: 300,
            totalPayout: 15300,
            startedAt: Date.now() - (1.5 * 86400000),
            maturityDate: Date.now() + (1.5 * 86400000),
            status: 'ACTIVE'
          }
        ];
      });

      const [deposits, setDeposits] = useState(() => {
        const saved = localStorage.getItem('sfc_deposits');
        return saved ? JSON.parse(saved) : [
          { id: 'DEP-8841', phone: '+250788123456', amount: 15000, momoTxId: 'TXN89327110', status: 'APPROVED', time: '1 day ago' }
        ];
      });

      const [withdrawals, setWithdrawals] = useState(() => {
        const saved = localStorage.getItem('sfc_withdrawals');
        return saved ? JSON.parse(saved) : [
          { id: 'WTH-3021', phone: '+250788123456', amount: 15300, status: 'PENDING', time: '4 hours ago' }
        ];
      });

      const [announcements, setAnnouncements] = useState([
        { id: '1', title: '🛡️ 20,000,000 RWF Capital Reserve Backing', content: 'All user 3-day savings cycles are 100% insured against loss.', urgent: false },
        { id: '2', title: '⚡ MoMo Merchant Deposit Activated', content: 'Direct merchant code *182*8*1*1799283# deposits are credited instantly.', urgent: false }
      ]);

      const [depositModalOpen, setDepositModalOpen] = useState(false);
      const [selectedTierForDeposit, setSelectedTierForDeposit] = useState(TIERS_DATA[2]);
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        localStorage.setItem('sfc_cycles', JSON.stringify(userCycles));
      }, [userCycles]);

      useEffect(() => {
        localStorage.setItem('sfc_deposits', JSON.stringify(deposits));
      }, [deposits]);

      useEffect(() => {
        localStorage.setItem('sfc_withdrawals', JSON.stringify(withdrawals));
      }, [withdrawals]);

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const formatMoney = (rwfAmount) => {
        const cur = CURRENCIES[currency];
        const val = rwfAmount * cur.rate;
        if (currency === 'RWF') return Math.round(val).toLocaleString() + ' RWF';
        return cur.symbol + val.toFixed(2);
      };

      const totalDeposited = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.depositAmount, 0);
      }, [userCycles]);

      const totalEarned = useMemo(() => {
        return userCycles.reduce((acc, c) => acc + c.profit, 0);
      }, [userCycles]);

      const handleStartCycle = (tier, customAmount = null) => {
        const amount = customAmount || tier.minAmount;
        const profit = Math.round(amount * tier.rate);
        const newCycle = {
          id: 'CYC-' + Math.floor(1000 + Math.random() * 9000),
          tierName: tier.name,
          depositAmount: amount,
          interestRate: tier.rate,
          profit: profit,
          totalPayout: amount + profit,
          startedAt: Date.now(),
          maturityDate: Date.now() + (tier.durationDays * 86400000),
          status: 'ACTIVE'
        };
        setUserCycles([newCycle, ...userCycles]);
        showToast(`🎉 3-Day Savings Cycle Activated for ${formatMoney(amount)}!`);
      };

      const handleDepositSubmit = (formData) => {
        const newDep = {
          id: 'DEP-' + Math.floor(1000 + Math.random() * 9000),
          phone: formData.phone,
          amount: Number(formData.amount),
          momoTxId: formData.txId,
          status: 'APPROVED',
          time: 'Just now'
        };
        setDeposits([newDep, ...deposits]);
        handleStartCycle(formData.tier, Number(formData.amount));
        setDepositModalOpen(false);
      };

      const handleWithdrawSubmit = (phone, amount) => {
        const numAmount = Number(amount);
        if (!phone || numAmount <= 0) {
          showToast('Please enter a valid phone and amount', 'error');
          return;
        }
        const newWth = {
          id: 'WTH-' + Math.floor(1000 + Math.random() * 9000),
          phone,
          amount: numAmount,
          status: 'PENDING',
          time: 'Just now'
        };
        setWithdrawals([newWth, ...withdrawals]);
        showToast(`🚀 Withdrawal request of ${formatMoney(numAmount)} submitted to ${phone}!`);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#001A40] text-white shadow-lg border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-[#E5A93B] to-amber-300 text-[#001A40] flex items-center justify-center font-extrabold text-xl shadow-md">
                  SFC
                </div>
                <div>
                  <div className="font-extrabold text-lg tracking-tight leading-none text-white">SMART FUTURE CAPITAL</div>
                  <div className="text-xs text-amber-400 font-semibold tracking-wider">3-DAY HIGH YIELD VAULT</div>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/60 p-1 rounded-xl border border-slate-700/50">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('cycles')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'cycles' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Active Cycles ({userCycles.length})
                </button>
                <button
                  onClick={() => setActiveTab('withdraw')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'withdraw' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Withdrawals
                </button>
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'admin' ? 'bg-[#E5A93B] text-[#001A40] shadow' : 'text-slate-300 hover:text-white'}`}
                >
                  Admin Hub
                </button>
              </nav>

              {/* Action and Currency */}
              <div className="flex items-center gap-3">
                <select
                  value={currency}
                  onChange={(e) => setCurrency(e.target.value)}
                  className="bg-slate-800 text-amber-400 text-xs font-bold px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400"
                >
                  <option value="RWF">🇷🇼 RWF</option>
                  <option value="USD">🇺🇸 USD ($)</option>
                  <option value="KES">🇰🇪 KES (KSh)</option>
                  <option value="UGX">🇺🇬 UGX (USh)</option>
                  <option value="EUR">🇪🇺 EUR (€)</option>
                </select>

                <button
                  onClick={() => { setSelectedTierForDeposit(TIERS_DATA[2]); setDepositModalOpen(true); }}
                  className="bg-gradient-to-r from-[#E5A93B] to-amber-400 text-[#001A40] px-4 py-2 rounded-xl text-sm font-extrabold shadow-md hover:brightness-110 active:scale-95 transition-all"
                >
                  + Deposit
                </button>
              </div>
            </div>

            {/* Mobile Tab Bar */}
            <div className="md:hidden flex border-t border-slate-800 bg-slate-900/90 px-2 py-1 justify-around text-xs font-bold text-slate-400">
              <button onClick={() => setActiveTab('dashboard')} className={`py-1.5 px-2 ${activeTab === 'dashboard' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Dashboard</button>
              <button onClick={() => setActiveTab('cycles')} className={`py-1.5 px-2 ${activeTab === 'cycles' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Cycles</button>
              <button onClick={() => setActiveTab('withdraw')} className={`py-1.5 px-2 ${activeTab === 'withdraw' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Withdraw</button>
              <button onClick={() => setActiveTab('admin')} className={`py-1.5 px-2 ${activeTab === 'admin' ? 'text-amber-400 border-b-2 border-amber-400' : ''}`}>Admin</button>
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className={`fixed top-20 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-bold text-sm flex items-center gap-2 transition-all transform animate-bounce ${notification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
              <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{notification.msg}</span>
            </div>
          )}

          {/* Announcements Banner */}
          <div className="bg-gradient-to-r from-amber-500/15 via-amber-400/10 to-amber-500/15 border-b border-amber-500/30 px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between text-xs sm:text-sm font-semibold text-slate-800">
              <div className="flex items-center gap-2 overflow-hidden">
                <span className="bg-amber-500 text-slate-950 text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full">Reserve Protected</span>
                <span className="truncate">{announcements[0]?.title} — {announcements[0]?.content}</span>
              </div>
              <span className="hidden sm:inline-block text-xs font-bold text-amber-700 ml-4 whitespace-nowrap">
                Reserve: {formatMoney(reserveFund)}
              </span>
            </div>
          </div>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'dashboard' && (
              <DashboardView
                formatMoney={formatMoney}
                reserveFund={reserveFund}
                totalDeposited={totalDeposited}
                totalEarned={totalEarned}
                activeCyclesCount={userCycles.length}
                tiers={TIERS_DATA}
                onSelectTier={(tier) => { setSelectedTierForDeposit(tier); setDepositModalOpen(true); }}
                userCycles={userCycles}
              />
            )}

            {activeTab === 'cycles' && (
              <CyclesView
                cycles={userCycles}
                formatMoney={formatMoney}
                onOpenDeposit={() => { setSelectedTierForDeposit(TIERS_DATA[2]); setDepositModalOpen(true); }}
              />
            )}

            {activeTab === 'withdraw' && (
              <WithdrawView
                withdrawals={withdrawals}
                formatMoney={formatMoney}
                availableBalance={totalDeposited + totalEarned}
                onSubmitWithdraw={handleWithdrawSubmit}
              />
            )}

            {activeTab === 'admin' && (
              <AdminHubView
                reserveFund={reserveFund}
                onUpdateReserve={setReserveFund}
                deposits={deposits}
                withdrawals={withdrawals}
                cycles={userCycles}
                formatMoney={formatMoney}
                announcements={announcements}
                onAddAnnouncement={(ann) => setAnnouncements([ann, ...announcements])}
              />
            )}
          </main>

          {/* Deposit Modal */}
          {depositModalOpen && (
            <DepositModal
              tier={selectedTierForDeposit}
              formatMoney={formatMoney}
              onClose={() => setDepositModalOpen(false)}
              onSubmit={handleDepositSubmit}
            />
          )}

          {/* Footer */}
          <footer className="bg-[#001A40] text-slate-400 border-t border-slate-800 py-8 px-4 text-center text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                <span className="font-bold text-slate-200">SMART FUTURE CAPITAL (SFC) React JSX Cloud Engine</span>
              </div>
              <div className="text-slate-400">
                Deployed on Vercel Global Edge Network • Backed by 20M RWF Reserve
              </div>
              <div>
                © 2026 SFC Ltd. All rights reserved.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // DASHBOARD VIEW
    function DashboardView({ formatMoney, reserveFund, totalDeposited, totalEarned, activeCyclesCount, tiers, onSelectTier, userCycles }) {
      const [calcPrincipal, setCalcPrincipal] = useState(15000);
      const [calcCycles, setCalcCycles] = useState(5);

      const calcYield = useMemo(() => {
        const singleCycle = calcPrincipal * 0.02;
        const totalProfit = singleCycle * calcCycles;
        return {
          single: singleCycle,
          totalProfit: totalProfit,
          totalPayout: calcPrincipal + totalProfit,
          days: calcCycles * 3
        };
      }, [calcPrincipal, calcCycles]);

      return (
        <div className="space-y-8">
          {/* Hero Bento Banner */}
          <div className="bg-gradient-to-br from-[#001A40] via-[#05285D] to-[#001433] rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden border border-slate-700/60">
            <div className="absolute top-0 right-0 w-96 h-96 bg-amber-400/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="relative z-10 max-w-3xl space-y-4">
              <div className="inline-flex items-center gap-2 bg-amber-400/20 text-amber-300 px-3.5 py-1.5 rounded-full text-xs font-extrabold border border-amber-400/30">
                <span>🛡️</span> Insured Liquidity Reserve: {formatMoney(reserveFund)}
              </div>
              
              <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                Automated <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">3-Day High-Yield</span> Savings Cycles
              </h1>
              
              <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                Deposit safely into automated fixed-yield 3-day micro-cycles. Earn guaranteed 2.0% returns with instant MTN & Airtel Mobile Money settlements.
              </p>

              <div className="pt-2 flex flex-wrap gap-4">
                <button
                  onClick={() => onSelectTier(tiers[2])}
                  className="bg-gradient-to-r from-[#E5A93B] to-amber-400 text-[#001A40] px-6 py-3 rounded-xl font-extrabold shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm"
                >
                  🚀 Start 3-Day Cycle ({formatMoney(15000)})
                </button>
                <a
                  href="#calculator-section"
                  className="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-6 py-3 rounded-xl font-bold transition-all text-sm flex items-center gap-2"
                >
                  <span>📈</span> Calculate Earnings
                </a>
              </div>
            </div>

            {/* Quick Metrics Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 pt-8 border-t border-slate-700/60">
              <div>
                <div className="text-xs text-slate-400 font-semibold">Active Deposits</div>
                <div className="text-xl sm:text-2xl font-extrabold text-white mt-1">{formatMoney(totalDeposited)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Total Yield Accrued</div>
                <div className="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-1">+{formatMoney(totalEarned)}</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Active Cycles</div>
                <div className="text-xl sm:text-2xl font-extrabold text-amber-400 mt-1">{activeCyclesCount} Active</div>
              </div>
              <div>
                <div className="text-xs text-slate-400 font-semibold">Lock Duration</div>
                <div className="text-xl sm:text-2xl font-extrabold text-blue-300 mt-1">3 Days Fixed</div>
              </div>
            </div>
          </div>

          {/* Available Savings Tiers */}
          <div>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900">Choose a Savings Tier</h2>
                <p className="text-xs sm:text-sm text-slate-500 font-medium">Select a deposit tier to start compounding returns every 72 hours</p>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              {tiers.map((tier) => {
                const profit = Math.round(tier.minAmount * tier.rate);
                const isFeatured = tier.id === 'tier_c';
                return (
                  <div
                    key={tier.id}
                    className={`bg-white rounded-2xl p-6 border transition-all hover:shadow-xl flex flex-col justify-between relative ${isFeatured ? 'border-amber-400 ring-2 ring-amber-400/20 shadow-md' : 'border-slate-200'}`}
                  >
                    {isFeatured && (
                      <span className="absolute -top-3 right-4 bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-full shadow">
                        ⭐ Most Savers Choice
                      </span>
                    )}

                    <div>
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">{tier.badge}</div>
                      <h3 className="text-lg font-extrabold text-slate-900 mt-1">{tier.name}</h3>
                      <p className="text-xs text-slate-500 mt-1">{tier.desc}</p>

                      <div className="my-5 p-3.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1.5">
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">Deposit Principal:</span>
                          <span className="font-extrabold text-slate-900">{formatMoney(tier.minAmount)}</span>
                        </div>
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">Lock Duration:</span>
                          <span className="font-bold text-blue-600">3 Days (72h)</span>
                        </div>
                        <div className="flex justify-between text-xs">
                          <span className="text-slate-500">3-Day Profit (+2.0%):</span>
                          <span className="font-extrabold text-emerald-600">+{formatMoney(profit)}</span>
                        </div>
                        <div className="pt-1.5 border-t border-slate-200 flex justify-between text-xs font-extrabold">
                          <span className="text-slate-700">Total Matured Payout:</span>
                          <span className="text-slate-950">{formatMoney(tier.minAmount + profit)}</span>
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={() => onSelectTier(tier)}
                      className={`w-full py-2.5 rounded-xl font-extrabold text-sm transition-all shadow-sm ${isFeatured ? 'bg-[#001A40] text-amber-400 hover:bg-[#05285D]' : 'bg-slate-100 hover:bg-slate-200 text-slate-900'}`}
                    >
                      Deposit {formatMoney(tier.minAmount)}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Interactive Yield Calculator & MoMo Deposit Guide */}
          <div id="calculator-section" className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {/* Calculator Card */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-md">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl font-bold">
                  📈
                </div>
                <div>
                  <h3 className="text-lg font-extrabold text-slate-900">Compound Yield Calculator</h3>
                  <p className="text-xs text-slate-500">Estimate profits across consecutive 3-day micro cycles</p>
                </div>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Deposit Principal (RWF):</label>
                  <input
                    type="number"
                    value={calcPrincipal}
                    onChange={(e) => setCalcPrincipal(Number(e.target.value))}
                    step="1000"
                    min="1000"

    // UNIFIED STATUS INDICATOR COMPONENT (Processing, Maturing, Completed, Flagged)
    function StatusIndicator({ status, mode = 'badge', text = null }) {
      const normalized = (() => {
        const s = (status || '').toString().toUpperCase();
        if (s.includes('MATUR') || s === 'ACTIVE') return 'Maturing';
        if (s.includes('PROCESS') || s === 'PENDING' || s === 'INITIATED') return 'Processing';
        if (s.includes('COMPLET') || s === 'APPROVED' || s === 'PAID' || s === 'SUCCESS' || s === 'MATURED') return 'Completed';
        if (s.includes('FLAG') || s === 'REJECT' || s === 'FAILED' || s === 'REVIEW' || s === 'HOLD') return 'Flagged';
        return 'Processing';
      })();

      const configs = {
        Processing: {
          label: text || 'Processing',
          icon: '⏳',
          dotClass: 'bg-amber-500 animate-pulse',
          badgeClass: 'bg-amber-100 text-amber-800 border-amber-300',
          iconBoxClass: 'bg-amber-100 text-amber-600 border-amber-300 shadow-amber-500/20',
          description: 'Transaction in verification queue (1-10m)'
        },
        Maturing: {
          label: text || 'Maturing (72h)',
          icon: '⚡',
          dotClass: 'bg-blue-500 animate-pulse',
          badgeClass: 'bg-blue-100 text-blue-800 border-blue-300',
          iconBoxClass: 'bg-blue-100 text-blue-600 border-blue-300 shadow-blue-500/20',
          description: 'Accruing 2.0% high-yield interest in locked vault'
        },
        Completed: {
          label: text || 'Completed',
          icon: '✅',
          dotClass: 'bg-emerald-500',
          badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300',
          iconBoxClass: 'bg-emerald-100 text-emerald-600 border-emerald-300 shadow-emerald-500/20',
          description: 'Funds successfully settled & disbursed'
        },
        Flagged: {
          label: text || 'Flagged',
          icon: '🚩',
          dotClass: 'bg-rose-500',
          badgeClass: 'bg-rose-100 text-rose-800 border-rose-300',
          iconBoxClass: 'bg-rose-100 text-rose-600 border-rose-300 shadow-rose-500/20',
          description: 'Under administrative safety review'
        }
      };

      const cfg = configs[normalized];

      if (mode === 'icon') {
        return (
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold border ${cfg.iconBoxClass} shadow-sm transition-transform hover:scale-105`}>
            <span>{cfg.icon}</span>
          </div>
        );
      }

      if (mode === 'full') {
        return (
          <div className="flex items-center gap-3">
            <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold border ${cfg.iconBoxClass} shadow-sm`}>
              <span>{cfg.icon}</span>
            </div>
            <div>
              <span className={`inline-flex items-center gap-1.5 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border tracking-wider ${cfg.badgeClass}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${cfg.dotClass}`}></span>
                <span>{cfg.label}</span>
              </span>
              <p className="text-[11px] text-slate-500 mt-0.5">{cfg.description}</p>
            </div>
          </div>
        );
      }

      return (
        <span className={`inline-flex items-center gap-1.5 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border tracking-wider ${cfg.badgeClass} shadow-sm`}>
          <span>{cfg.icon}</span>
          <span>{cfg.label}</span>
        </span>
      );
    }

                          className={`flex-1 py-1.5 text-xs font-black rounded-lg border transition-all ${
                            cryptoNetwork === net
                              ? 'bg-emerald-500 text-white border-emerald-600 shadow'
                              : 'bg-white text-slate-700 border-slate-300'
                          }`}
                        >
                          {net}
                        </button>
                      ))}
                    </div>

                    <div className="bg-white p-3 rounded-xl border border-emerald-300 flex items-center justify-between gap-2 text-xs">
                      <div className="truncate font-mono font-bold text-emerald-800">
                        {cryptoAddress}
                      </div>
                      <button
                        type="button"
                        onClick={() => copyToClipboard(cryptoAddress, 'crypto')}
                        className="px-2.5 py-1 bg-emerald-500 text-white font-bold rounded-lg text-xs whitespace-nowrap shadow"
                      >
                        {copiedText === 'crypto' ? '✅ Copied' : '📋 Copy'}
                      </button>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">
                        Blockchain Tx Hash:
                      </label>
                      <input
                        type="text"
                        placeholder="0x... or TRC20 Hash"
                        value={cryptoTxHash}
                        onChange={(e) => setCryptoTxHash(e.target.value)}
                        className="w-full bg-white border border-emerald-300 rounded-xl px-4 py-2 font-mono text-xs font-bold text-slate-900"
                      />
                    </div>
                  </div>
                )}

                <div className="pt-2 flex gap-3">
                  <button
                    type="button"
                    onClick={onClose}
                    className="w-1/3 py-3 rounded-xl border border-slate-200 font-bold text-xs sm:text-sm text-slate-600 hover:bg-slate-50 transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={triggerPaymentFlow}
                    className="w-2/3 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black text-xs sm:text-sm shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2"
                  >
                    <span>⚡ Pay {formatMoney(amount)} & Start</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
